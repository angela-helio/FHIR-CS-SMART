server:
  port: 8080

smart:
  # For standalone testing only. In EHR launch, these come from `iss` and `launch` query params.
  fhirBase: "https://fhir.fhirpoint.open.allscripts.com/fhirroute/fhir/CP00101/"
  clientId: "${VERADIGM_CLIENT_ID:09d5c8e8-9712-4c7f-85ed-7514d565fcae}"
  clientSecret: "${VERADIGM_CLIENT_SECRET:1C669E09918B}"
  redirectUri: "${SMART_REDIRECT_URI:https://56fc328c2d08.ngrok-free.app/callback}"
  scopes: "launch/patient patient.read openid fhirUser offline_access"
  # launch: ""

  # Backend service authentication (for System-type apps)
  jwks:
    keyId: "${JWKS_KEY_ID:#{null}}"
  backend:
    enabled: "${BACKEND_AUTH_ENABLED:false}"
    scopes: "${BACKEND_SCOPES:system/*.read}"

spring:
  thymeleaf:
    cache: false
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev
smart:
  fhirBase: "https://fhir.fhirpoint.open.allscripts.com/fhirroute/fhir/CP00101/"
  redirectUri: "http://127.0.0.1:8080/callback"

---
# ngrok Profile (for external testing)
spring:
  config:
    activate:
      on-profile: ngrok
smart:
  fhirBase: "https://fhir.fhirpoint.open.allscripts.com/fhirroute/fhir/CP00101/"
  redirectUri: "https://56fc328c20d8.ngrok-free.app/callback"

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod
smart:
  fhirBase: "https://fhir.fhirpoint.open.allscripts.com/fhirroute/fhir/CP00101/"
  redirectUri: "${PRODUCTION_REDIRECT_URI}"
